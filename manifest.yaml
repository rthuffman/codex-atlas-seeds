notes: >-
  v0.3.29 (ATH-310): usg_executive_independent_orgs 0.2.2, usg_structure_assigned_attachments
  0.1.3, usg_appointed_offices 0.1.0-appointed-7 — the Executive Office of the President gets
  its component organisations (Office of the USTR, OMB, White House Office) as timeless
  eop_component vertices contained by the EOP; the USTR and OMB Director lead their component
  and no longer draw a Leadership edge to the EOP, the Chief of Staff's does. Prior v0.3.28: us_person_nickname_lookup 0.2.0 — names.csv advanced to upstream carltonnorthern
  commit 1524308b68 (2026-08-02, 2,827 rows; adds nicknames for common names missing from the
  dataset) from tag v1.0.1 content af6b3a8bbd (2,691 rows). Apache-2.0 repository licence
  unchanged; CSV scope tracked in athena-codex ATH-126. Prior v0.3.27: us_gold_current_structure 0.3.5 — also preserve House officer/leadership
  Office vertices (usg-gold-house-inst-*, usg-gold-house-ldr-*); v0.3.4 restored
  institutional SeatOf edges but those House rows were still dropped by the broad
  usg-gold-house-* legacy vertex filter, breaking full-seeds projection ingest.
  Prior v0.3.26: us_gold_current_structure 0.3.4 — preserve institutional SeatOf
  edges (Senate/House officers, caucus chairs, House leadership) in gold-current
  export; fixes orphan Office vertices on Prospectus bootstrap. Prior notes through
  v0.3.25 retained in git history.
