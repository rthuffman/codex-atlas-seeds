policy_format_version: 1

required_packs:
  - usg_administration_skeleton
  - usg_statutory_cabinet_timeline
  - usg_house_apportionment_vintages
  - usg_congress_session_bounds
  - usg_congress_state_seating
  - usg_house_non_voting_delegate_seats
  - us_geo_bootstrap
  - us_gold_current_structure
  - us_gold_historical_structure
  - us_house_district_topology
  - us_house_legislators_term_index

required_catalog_inauguration_years:
  - 1789
  - 1841
  - 1865
  - 1901
  - 1945
  - 2009
  - 2013
  - 2017
  - 2021
  - 2025

scope:
  sentinel:
    congresses: [118]
    administration_years: [2021]
  full:
    congresses: [1, 40, 80, 100, 118]
    administration_years: [1789, 1841, 1865, 1901, 1945, 2009, 2013, 2021, 2025]

catalog_only_congresses: [1, 40, 80, 100, 118]

# 2009/2021 moved here (v0.3.24): gold-detail still has Gen-2 seat→Cabinet Membership;
# Gen-3 builder emits Person→Cabinet only when officeholders resolve (usually none in
# parity fixtures), so gold-detail Membership counts are no longer a valid oracle.
catalog_only_administration_years: [1789, 1841, 1865, 1901, 1945, 2009, 2013, 2021, 2025]

# Empty: Gen-2 gold-detail Membership subset comparison retired for cabinet Membership.
administration_membership_gold_subset_years: []

allowed_gold_membership_extra:
  - Umbrella to numbered Congress

legacy_exceptions:
  - id: umbrella-to-numbered-congress
    applies_to: allowed_gold_membership_extra
    token: Umbrella to numbered Congress
    rationale: |
      Legacy gold-detail contains one umbrella membership edge for numbered Congress
      that is not emitted by the deterministic API-first congress builder.
    owner: artemis-structure
    retirement_criteria: |
      Remove this allowance after gold-detail parity source is normalized (or retired)
      so congress membership comparison is fully deterministic without umbrella-only extras.
    target_date: "2026-09-30"
  # Former timeline-v3-cabinet-level-membership / administration_membership_gold_subset_years
  # exception retired in v0.3.24: Gen-2 seat→Cabinet Membership in gold-detail is obsolete;
  # 2009/2021 (and all other scoped admin years) use catalog_only_administration_years.

reserved_prospectus_id_prefix: "72a4cd2a-fa72-774a-a73c-72587"

builder_fixture_mappings:
  - pack_id: usg_administration_skeleton
    source_file: catalog.json
    builder_fixture_name: us_administration_skeleton_catalog.json
  - pack_id: usg_statutory_cabinet_timeline
    source_file: timeline.json
    builder_fixture_name: us_statutory_cabinet_departments_timeline.json
  - pack_id: usg_house_apportionment_vintages
    source_file: vintages.json
    builder_fixture_name: us_house_apportionment_vintages.json
  - pack_id: usg_congress_session_bounds
    source_file: bounds.json
    builder_fixture_name: us_congress_session_bounds.json
  - pack_id: usg_congress_state_seating
    source_file: seating.json
    builder_fixture_name: us_congress_state_seating.json
  - pack_id: usg_house_non_voting_delegate_seats
    source_file: delegates.json
    builder_fixture_name: us_house_non_voting_delegate_seats.json
  - pack_id: us_house_district_topology
    source_file: topology.json
    builder_fixture_name: us_house_district_topology.json
  - pack_id: usg_federal_judiciary_orgs
    source_file: catalog.json
    builder_fixture_name: usg_federal_judiciary_orgs.json
  - pack_id: usg_executive_independent_orgs
    source_file: catalog.json
    builder_fixture_name: usg_executive_independent_orgs.json
  - pack_id: usg_appointed_offices
    source_file: catalog.json
    builder_fixture_name: usg_appointed_offices.json
  - pack_id: usg_senate_class_assignments
    source_file: class_assignments.json
    builder_fixture_name: usg_senate_class_assignments.json
