      - seating.json
  - pack_id: usg_house_non_voting_delegate_seats
    version: "0.2.0"
    files:
      - delegates.json
  - pack_id: us_geo_bootstrap
    version: "0.1.0"
    files:
      - bootstrap.json
  - pack_id: us_gold_current_structure
