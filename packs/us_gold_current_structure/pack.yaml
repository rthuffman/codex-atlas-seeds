pack_id: us_gold_current_structure
version: "0.3.2"
requires_atlas_schema_version: "1.2.0"
description: >
  Gold-current U.S. government structure (119th Congress + 47th administration shell).
  Prospectus ingest envelope without geo records; pairs with us_geo_bootstrap at projection.
  v0.2.0: 119th House offices/delegations use office_key and delegation_key temp ids
  (shared with session extend) for reference preflight PID alignment.
  v0.3.0: cabinet departments reshaped to Department → Secretary-office GovernmentalOrg (usg-gold-sos-*) → Cabinet secretary Office seat; department→enduring-Cabinet Membership removed.
  v0.3.1: every Office carries office_key (= submission_temp_id) so Prospectus projection
  persists queryable Office.office_key for House, Senate class, SCOTUS, cabinet, and officers.
  v0.3.2: Option A — drop Gen-2 seat→Cabinet/admin Membership from the 47th admin shell
  (15 cabseat + Pres/VP seat Membership); keep Cabinet/admin orgs and structural Membership.
  Person→Cabinet Membership is live extend only. SCOTUS Membership temp id renumbered
  usg-gold-leg-e00032→e00017 after Gen-1 dept→Cabinet edges left the 119th generator feed.
files:
  - envelope.json
