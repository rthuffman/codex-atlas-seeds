bundle_format_version: 1
bundle_version: "0.3.9"
requires_atlas_schema_version: "1.2.0"
notes: >
  Authoritative pack list for codex-atlas-seeds release bundles.
  ADR: athena-codex docs/decisions/2026-05-20-codex-atlas-seeds-reference-packs.md
  v0.2.0: 1789 USG catalog slice (admin, apportionment, session bounds, seating, delegates).
  v0.3.0: adds Prospectus projection packs — us_geo_bootstrap, us_gold_current_structure,
  us_gold_historical_structure (Option B: Atlas apply then bootstrap projection to Prospectus).
  v0.3.1: removes stale optional L1/L2/L3 from projection packs so Athena derives taxonomy from VertexType/EdgeType.
  v0.3.2: adds us_house_legislators_term_index — derived House holder lookup from congress-legislators (catalog pack).
  v0.3.3: tainted/superseded — inferred topology rows blurred plural districts and at-large seats.
  v0.3.4: corrective topology schema v2 with reviewed rows only, plural district seat codes,
  and term_index format_version 2.
  v0.3.5: Phase AT general-ticket promotion — reviewed statewide_general_ticket rows for the
  early at-large era (CT, NH, NJ, RI, DE, GA, VT) + CT 8th-Congress seat crosswalk; term_index
  regenerated so multi-member at-large delegations resolve to A..N seat codes (fixes CT-2/8th miss).
  Also corrects the structural apportionment off-by-one (usg_house_apportionment_vintages 0.2.1):
  every census now maps to the Congress where it took effect, so boundary-Congress seat counts and
  the general-ticket at-large counts are historically accurate (e.g. CT had 5 seats for the 2nd
  Congress, 7 from the 3rd).
  v0.3.6: adds usg_congress_session_readiness — Gate C operator certification catalog for
  next-session structure mint (ADR 2026-06-08); trims 2020 apportionment vintage to 118–122.
  v0.3.7: Civil War House structural corrections — admission/split apportionment overrides,
  operator-gold topology for congresses 36-41, and regenerated topology-aware term index.
  v0.3.8: Civil War operator-gold term index overlay for congresses 36-41 — holder spans,
  vacant office keys, and bioguide pins (e.g. KS Conway) from certified gold YAML; removes
  topology-extra term-index keys (MO-37 A/B/C, KY-40 A, VA 9-11 post-split).
  v0.3.9: Prune all non-gold term-index office_key residue in congresses 36-41 (75 legacy
  congress-legislators keys with wrong seat codes, e.g. 36|KS|1 vs gold 36|KS|A).
  Stable reference edits are one-way to this repo (see ADR 2026-05-21 stable-reference policy).
packs:
